name: GitHub Actions CI
on:
  push:
    branches: main
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Git repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: ShellCheck
      run: shellcheck .chezmoiscripts/*.sh
    - name: PSScriptAnalyzer
      shell: pwsh
      run: |
        if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
        }
        # Unix の pwsh はドット始まりを隠し扱いするため -Force で .chezmoiscripts も対象にする
        $files = Get-ChildItem -Recurse -Force -File -Filter '*.ps1' | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
        $files.FullName | Write-Output
        $results = $files | ForEach-Object {
          # PSAvoidUsingInvokeExpression: starship/zoxide の init 読み込みは Invoke-Expression が定石
          # PSUseBOMForUnicodeEncodedFile: .gitattributes で LF/UTF-8 (BOM なし) に統一しているため
          Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error, Warning -ExcludeRule PSAvoidUsingInvokeExpression, PSUseBOMForUnicodeEncodedFile
        }
        $results | Format-Table -AutoSize | Out-String | Write-Output
        if ($results) { exit 1 }
  unix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        shell:
          - bash
          - zsh
    env:
      # .chezmoi.yaml.tmpl は $SHELL からシェルを判定する
      SHELL: /bin/${{ matrix.shell }}
    steps:
    - name: Set up Git repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Install zsh
      if: matrix.shell == 'zsh' && runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y zsh
    - name: Set up homebrew
      uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # main
    - name: Install Chezmoi
      run: 'brew install chezmoi'
    - name: Test Chezmoi
      run: 'chezmoi init --apply --source $GITHUB_WORKSPACE'
    - name: Verify Chezmoi
      run: |
        chezmoi status --exclude scripts --source $GITHUB_WORKSPACE
        chezmoi diff --no-pager --exclude scripts --source $GITHUB_WORKSPACE
        chezmoi verify --exclude scripts --source $GITHUB_WORKSPACE
    - name: Load shell config
      run: |
        # ログイン + 対話シェルとして rc を読み込み、エラー出力がないことを確認する
        "$SHELL" -lic 'true' 2> err.txt || true
        cat err.txt
        if grep -iE 'command not found|not found|parse error|syntax error|no such file|error' err.txt; then
          exit 1
        fi
  windows:
    runs-on: windows-latest
    steps:
    - name: Set up Git repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: PowerShell Policy
      run: 'Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force'
    - name: Install Scoop
      uses: MinoruSekine/setup-scoop@6435f41324fa55988d8ce5b06bae5cafc75fe045 # v4
    - name: Install Chezmoi
      run: 'scoop install chezmoi'
    - name: Test Chezmoi Windows
      run: 'chezmoi init --apply --source $Env:GITHUB_WORKSPACE'
    - name: Verify Chezmoi Windows
      run: |
        chezmoi status --exclude scripts --source $Env:GITHUB_WORKSPACE
        chezmoi diff --no-pager --exclude scripts --source $Env:GITHUB_WORKSPACE
        chezmoi verify --exclude scripts --source $Env:GITHUB_WORKSPACE
    - name: Load PowerShell profile
      shell: pwsh
      run: |
        # 新しいシェルと同様にレジストリの PATH を反映する (scoop の env_add_path 対応)
        $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
        # プロファイルを明示的に読み込み、エラーが発生しないことを確認する
        pwsh -NoLogo -NoProfile -Command {
          $ErrorActionPreference = 'Continue'
          . $PROFILE
          if ($Error.Count -gt 0) { $Error | Out-String | Write-Output; exit 1 }
        }
        if ($LASTEXITCODE -ne 0) { exit 1 }
