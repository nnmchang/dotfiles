# デフォルト設定との差分のみを記述する
# https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml
# プレースホルダ: %s = 選択中の全ファイル, %s1 = 先頭のファイル, %d1 = 先頭のファイルの親ディレクトリ
# (yazi が OS に応じてクォートするため、自分で囲まない)

[opener]
edit = [
	{ run = "nvim %s", block = true, desc = "nvim" },
]
edit_dir = [
	{ run = "cd %s1 && nvim .", block = true, desc = "open directory with nvim", for = "unix" },
	{ run = "cd /d %s1 && nvim .", block = true, desc = "open directory with nvim", for = "windows" },
]
edit_current_dir = [
	{ run = "nvim .", block = true, desc = "open current directory with nvim" },
]
play = [
	{ run = "mpv --force-window %s", orphan = true, desc = "mpv" },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
	{ run = "mediainfo %s1 & pause", block = true, desc = "Show media info", for = "windows" },
]

[open]
# デフォルトのルールより優先して適用する
prepend_rules = [
	{ url = "*/", use = [ "edit_dir", "edit_current_dir", "open", "reveal" ] },
	{ mime = "text/*", use = [ "edit", "edit_current_dir", "reveal" ] },
]
